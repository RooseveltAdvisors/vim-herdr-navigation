name: CI

on:
  pull_request:
  push:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: shellcheck navigate.sh

      - name: Bash syntax check
        run: bash -n navigate.sh test/navigate_test.sh

      - name: Tests
        run: bash test/navigate_test.sh
