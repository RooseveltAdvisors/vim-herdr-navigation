id = "vim-herdr-navigation"
name = "Vim Herdr Navigation"
version = "0.1.1"
min_herdr_version = "0.7.0"
description = "Seamless Ctrl+h/j/k/l navigation across herdr panes and Vim/Neovim splits; Option/Alt force-focus actions"
platforms = ["linux", "macos"]

# Smart Ctrl path: forward into Vim when focused, else move herdr pane.
[[actions]]
id = "left"
title = "Navigate left (Vim/herdr)"
contexts = ["global"]
command = ["bash", "navigate.sh", "left"]

[[actions]]
id = "down"
title = "Navigate down (Vim/herdr)"
contexts = ["global"]
command = ["bash", "navigate.sh", "down"]

[[actions]]
id = "up"
title = "Navigate up (Vim/herdr)"
contexts = ["global"]
command = ["bash", "navigate.sh", "up"]

[[actions]]
id = "right"
title = "Navigate right (Vim/herdr)"
contexts = ["global"]
command = ["bash", "navigate.sh", "right"]

# Force path: always move herdr panes (never forward into nvim). Bind to alt/option+hjkl.
[[actions]]
id = "force-left"
title = "Force pane left (no editor forward)"
contexts = ["global"]
command = ["bash", "navigate.sh", "left", "force"]

[[actions]]
id = "force-down"
title = "Force pane down (no editor forward)"
contexts = ["global"]
command = ["bash", "navigate.sh", "down", "force"]

[[actions]]
id = "force-up"
title = "Force pane up (no editor forward)"
contexts = ["global"]
command = ["bash", "navigate.sh", "up", "force"]

[[actions]]
id = "force-right"
title = "Force pane right (no editor forward)"
contexts = ["global"]
command = ["bash", "navigate.sh", "right", "force"]
